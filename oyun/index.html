<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Arkadaş Arenası</title>
<style>:root {
  --bg: #0b0f1a; --bg2: #141a2b; --card: #1a2238; --card2: #222c48; --text: #eef2ff; --muted: #94a0c0;
  --accent: #5b8cff; --accent2: #9b5bff; --good: #46d86b; --bad: #ff4d4d;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
body { background: radial-gradient(1200px 600px at 50% -200px, #1e2a55 0%, var(--bg) 60%) fixed; }
#app { height: 100%; overflow-y: auto; }
button { font: inherit; color: inherit; }
.page { max-width: 560px; margin: 0 auto; padding: 12px 16px 40px; }
.topbar { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; margin: 4px 0 12px; }
.top-title { text-align: center; font-weight: 700; font-size: 18px; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--card); font-size: 26px; line-height: 1; cursor: pointer; }
.hero { text-align: center; padding: 24px 0 12px; }
.hero h1 { margin: 6px 0; font-size: 30px; letter-spacing: -0.5px; background: linear-gradient(90deg, #8fb0ff, #c79bff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.logo { font-size: 56px; filter: drop-shadow(0 6px 18px rgba(91, 140, 255, .5)); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.center { text-align: center; }
.foot { text-align: center; font-size: 12px; margin-top: 24px; }
.card { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; border: 1px solid #ffffff10; background: linear-gradient(160deg, var(--card2), var(--card)); border-radius: 18px; padding: 14px; margin: 10px 0; cursor: pointer; position: relative; transition: transform .12s; box-shadow: 0 6px 20px #0005; }
.card:active { transform: scale(.98); }
.card.big { padding: 20px 16px; }
.card.dim { opacity: .45; }
.card-icon { font-size: 34px; width: 52px; height: 52px; display: grid; place-items: center; background: #ffffff0d; border-radius: 14px; flex: none; }
.card-title { font-weight: 700; font-size: 17px; }
.card-desc { color: var(--muted); font-size: 13.5px; margin-top: 3px; line-height: 1.35; }
.badge { position: absolute; top: 10px; right: 10px; font-size: 10.5px; font-weight: 800; background: linear-gradient(90deg, var(--accent), var(--accent2)); padding: 3px 7px; border-radius: 99px; letter-spacing: .5px; }
.grid { display: grid; grid-template-columns: 1fr; gap: 0; }
.help { background: var(--card); border-radius: 14px; padding: 12px 14px; margin-top: 14px; }
.help summary { cursor: pointer; font-weight: 600; }
.help li { margin: 6px 0; color: var(--muted); }
.label { display: block; margin: 8px 2px 6px; color: var(--muted); font-size: 13px; }
.input { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid #ffffff20; background: var(--bg2); color: var(--text); font-size: 16px; outline: none; }
.input:focus { border-color: var(--accent); }
.mono { font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all; resize: none; }
.btn { display: block; width: 100%; padding: 15px; border: 0; border-radius: 14px; background: var(--card2); font-weight: 700; font-size: 16px; margin: 10px 0; cursor: pointer; }
.btn.primary { background: linear-gradient(90deg, var(--accent), var(--accent2)); box-shadow: 0 6px 20px #5b8cff55; }
.btn.small { padding: 9px 12px; font-size: 14px; width: auto; display: inline-block; }
.btn.ghost { background: transparent; border: 1px solid #ffffff25; }
.btn:active { transform: scale(.98); }
.players { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--card); border-radius: 99px; padding: 8px 14px 8px 10px; display: flex; align-items: center; gap: 8px; font-weight: 600; border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
.waiting { display: flex; align-items: center; gap: 12px; justify-content: center; color: var(--muted); padding: 24px 0; }
.spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid #ffffff22; border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.invite { text-align: center; }
.step { margin: 10px 0; font-size: 16px; }
.qr-wrap { display: inline-block; padding: 8px; background: #fff; border-radius: 16px; margin: 8px 0; }
.qr { display: block; width: min(78vw, 300px); height: auto; image-rendering: pixelated; }
.codebox { text-align: left; margin: 10px 0; color: var(--muted); }
.codebox summary { cursor: pointer; font-size: 14px; margin-bottom: 8px; }
.scanner { position: relative; width: 100%; aspect-ratio: 1; max-width: 360px; margin: 8px auto; border-radius: 18px; overflow: hidden; background: #000; }
.scanner video { width: 100%; height: 100%; object-fit: cover; }
.scan-frame { position: absolute; inset: 15%; border: 3px solid #ffffffcc; border-radius: 16px; box-shadow: 0 0 0 999px #0006; }
.scan-status { position: absolute; left: 0; right: 0; bottom: 8px; font-size: 13px; padding: 0 10px; text-shadow: 0 1px 3px #000; }
.toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); background: #222c48f0; padding: 12px 18px; border-radius: 12px; z-index: 1000; box-shadow: 0 8px 30px #0008; transition: opacity .4s; max-width: 90vw; text-align: center; }
.toast.out { opacity: 0; }
.results { margin: 16px 0; }
.res-row { display: flex; align-items: center; gap: 12px; padding: 14px; margin: 8px 0; border-radius: 14px; background: var(--card); border-left: 5px solid var(--c); font-size: 18px; }
.medal { width: 34px; text-align: center; font-size: 22px; }
.rname { flex: 1; font-weight: 700; }
.rscore { font-weight: 800; font-variant-numeric: tabular-nums; }

/* ---- oyun alanı ---- */
.game { position: fixed; inset: 0; overflow: hidden; background: #000; user-select: none; -webkit-user-select: none; touch-action: none; }
.game canvas { display: block; }
.exit-btn { position: absolute; z-index: 50; top: 50%; right: 8px; transform: translateY(-50%); width: 38px; height: 38px; border-radius: 50%; border: 0; background: #0008; color: #fff; font-size: 18px; backdrop-filter: blur(4px); cursor: pointer; }
.layer { position: absolute; inset: 0; }
.half { position: absolute; left: 0; right: 0; height: 50%; }
.half.top { top: 0; transform: rotate(180deg); }
.half.bottom { bottom: 0; }
.joy-base { position: absolute; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; background: #ffffff18; border: 2px solid #ffffff40; pointer-events: none; }
.joy-knob { position: absolute; left: 30px; top: 30px; width: 50px; height: 50px; border-radius: 50%; background: #ffffffaa; box-shadow: 0 2px 10px #0006; }
.hud { position: absolute; z-index: 10; pointer-events: none; color: #fff; text-shadow: 0 2px 6px #000a; font-weight: 800; }
.countdown { position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; pointer-events: none; font-size: 120px; font-weight: 900; color: #fff; text-shadow: 0 6px 30px #000; }
.countdown.dual { grid-template-rows: 1fr 1fr; }
.countdown .flip { transform: rotate(180deg); }
.gbtn { position: absolute; z-index: 20; border-radius: 50%; border: 3px solid #ffffff55; background: #ffffff22; color: #fff; font-weight: 900; display: grid; place-items: center; backdrop-filter: blur(3px); font-size: 18px; }
.gbtn.down { background: #ffffff55; transform: scale(.94); }
.banner { position: absolute; left: 0; right: 0; z-index: 30; text-align: center; font-size: 34px; font-weight: 900; color: #fff; text-shadow: 0 4px 20px #000; pointer-events: none; }
.panel { position: absolute; inset: 0; overflow-y: auto; padding: 16px; background: radial-gradient(900px 500px at 50% -100px, #1e2a55 0%, var(--bg) 60%); }
.panel .inner { max-width: 560px; margin: 0 auto; }
.opt { display: block; width: 100%; padding: 16px; margin: 10px 0; border-radius: 14px; border: 2px solid #ffffff15; background: var(--card); font-size: 17px; font-weight: 700; text-align: left; cursor: pointer; }
.opt.sel { border-color: var(--accent); background: #2a3a6a; }
.opt.right { border-color: var(--good); background: #1e4a2e; }
.opt.wrong { border-color: var(--bad); background: #4a1e24; }
.bigq { font-size: 22px; font-weight: 800; margin: 14px 0; line-height: 1.3; }
.timerbar { height: 8px; border-radius: 99px; background: #ffffff15; overflow: hidden; }
.timerbar > div { height: 100%; background: linear-gradient(90deg, var(--good), #ffc93c, var(--bad)); transition: width .1s linear; }
.scoreline { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.scoreline .chip { padding: 5px 10px 5px 8px; font-size: 13px; }
</style>
</head>
<body>
<div id="app"></div>
